# One grouped pull request a week for minor and patch updates, and Next kept in step with its
# ESLint config, whose versions must match. New releases wait a few days before they are proposed;
# security updates are not delayed. Update docs/dependencies.md in the same pull request as a major.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 30
    ignore:
      # TypeScript 7 is the native compiler; its package exports no JavaScript API (only
      # `typescript/unstable/*`), which Next's build and typescript-eslint (inside
      # eslint-config-next) load. With 7 installed, `npm run lint` fails to start.
      # Remove this once both support it; docs/dependencies.md tracks the hold.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["next", "eslint-config-next"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
